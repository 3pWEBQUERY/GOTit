name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://app:app@localhost:5432/app
  REDIS_URL: redis://localhost:6379
  APP_URL: http://localhost:3000
  APP_NAME: GOTit
  # Nur für die CI erzeugte Werte, keine Geheimnisse einer echten Umgebung.
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
  AGE_GATE_SECRET: ci-only-age-gate-ci-only-age-gate-ci-only
  MAIL_TRANSPORT: outbox

jobs:
  quality:
    name: Lint, Typen, Tests, Dateigrösse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dateigrössen-Prüfung (PRD 4.1, harte Grenze 600 Zeilen)
        run: pnpm check:file-size
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Abhängigkeits-Scan (PRD 16.2)
        run: pnpm audit --prod --audit-level high

  e2e:
    name: End-to-End mit axe
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/web exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - name: Referenzdaten und fiktive Testkonten laden
        run: pnpm --filter @app/db seed:fixtures
      - run: pnpm build
        env:
          ENABLE_DEV_UI: "1"
      - run: pnpm test:e2e
        env:
          CI: "1"
          ENABLE_DEV_UI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
